[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "specgraph"
version = "0.1.0"
description = "A specification graph whose truth is computed place by place, with its lint and its read side."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
test = ["pytest"]

# The command's name is set here and nowhere else in the code.
[project.scripts]
specgraph = "specgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specgraph = ["profiles/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
