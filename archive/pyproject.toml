[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airone-archive"
version = "0.1.0"
description = "The archive's checker: every archived file's freeze stamp, a log row for every change made to one, and the vocabulary conflicts that apply to a file."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

# The command's name is set here and nowhere else in the code.
[project.scripts]
check-archive = "check_archive:main"

# The checker stays one file at tools/check_archive.py, so it still runs as a script from the kit; installed, it is the
# top-level module check_archive. Its tests beside it are not installed.
[tool.setuptools]
package-dir = {"" = "tools"}
py-modules = ["check_archive"]
